name: Validate GPU kernels
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Registered runner label with the target PyTorch environment
        required: true
        type: string
      target:
        description: Expected GPU architecture (for example gfx1100 or gfx1201)
        required: true
        type: string
permissions:
  contents: read
jobs:
  operator:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --no-deps .
      - run: python tools/validate_gpu.py --triton
        env:
          SPARSEGP_TARGET: ${{ inputs.target }}
